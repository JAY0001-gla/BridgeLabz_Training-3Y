<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Flip</title>
<style>
body {margin:0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;}
.scene {width:200px;height:300px;perspective:1000px;}
.card {
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform 0.8s;
}
.scene:hover .card {transform:rotateY(180deg);}
.card div {
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;display:flex;justify-content:center;align-items:center;
  font-size:20px;padding:10px;
}
.front {background:#eee;}
.back {background:#ddd;transform:rotateY(180deg);}
</style>
</head>
<body>
<div class="scene">
  <div class="card">
    <div class="front">Title + Image</div>
    <div class="back">Description text here...</div>
  </div>
</div>
</body>
</html>
