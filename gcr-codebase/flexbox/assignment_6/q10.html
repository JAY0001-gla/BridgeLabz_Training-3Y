<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Layout</title>
<style>
body {margin:0;font-family:sans-serif;}
header {display:flex;justify-content:space-between;align-items:center;background:#eee;padding:15px;}
main {display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:20px;}
article {display:flex;gap:10px;}
.box {flex:1;background:#ddd;padding:20px;}
footer {text-align:center;background:#ccc;padding:10px;}
@keyframes fadeup {from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
h2 {animation:fadeup 1s;}
@media(max-width:700px){main{grid-template-columns:1fr;article{flex-direction:column;}}}
</style>
</head>
<body>
<header>
  <div class="logo">Logo</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>
<main>
  <article>
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </article>
  <aside>Sidebar content</aside>
</main>
<footer>© 2026 Jay Sharma</footer>
</body>
</html>
