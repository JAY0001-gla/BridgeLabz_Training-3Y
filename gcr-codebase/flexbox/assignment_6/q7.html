<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading Animation</title>
<style>
body {margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}
.loader {display:flex;gap:10px;}
.circle {
  width:20px;height:20px;background:#333;border-radius:50%;
  animation:updown 0.6s infinite alternate;
}
.circle:nth-child(2){animation-delay:0.2s;}
.circle:nth-child(3){animation-delay:0.4s;}
@keyframes updown {
  from {transform:translateY(0);}
  to {transform:translateY(-20px);}
}
</style>
</head>
<body>
<div class="loader">
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
</div>
</body>
</html>
