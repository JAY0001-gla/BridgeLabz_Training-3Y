<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <form>
        <p>
            <label for="country">Country:</label>
            <select id="country">
                <option selected>India</option>
                <option>Nepal</option>
                <option>Japan</option>
            </select>
        </p>

        <p>
            <label for="state">State:</label>
            <select id="state">
                <option selected>Uttar Pradesh</option>
                <option>Rajasthan</option>
                <option>Goa</option>
            </select>
        </p>

        <p>
            <label for="city">City:</label>
            <select id="city">
                <option selected>Agra</option>
                <option>Jaipur</option>
                <option>Varanasi</option>
            </select>
        </p>

        <p>
            <label for="place">Favorite Tourist Place:</label>
            <select id="place">
                <option selected>Taj Mahal</option>
                <option>Hawa Mahal</option>
                <option>Goa Beach</option>
            </select>
        </p>
    </form>

    <p>My selected destination is India, Uttar Pradesh, Agra and my favorite tourist place is the Taj Mahal.</p>

</body>
</html>
