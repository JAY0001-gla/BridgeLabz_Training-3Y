<!DOCTYPE html>
<html>
<head>
    <title>Payment Form</title>
</head>
<body>

    <h1>Payment Form</h1>

    <form>

        <label>Cardholder Name:</label>
        <input type="text" required>

        <br><br>

        <label>Card Number:</label>
        <input type="text" required>

        <br><br>

        <label>Expiry Date:</label>
        <input type="text" required>

        <br><br>

        <label>CVV:</label>
        <input type="password" required>

        <br><br>

        <input type="submit" value="Pay Now">

    </form>

</body>
</html>
