<!DOCTYPE html>
<html>
<head>
    <title>Secure Form</title>
</head>
<body>

    <h1>Secure Form</h1>

    <form autocomplete="off">

        <label>Name:</label>
        <input type="text" required>

        <br><br>

        <label>Email:</label>
        <input type="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Turning off autocomplete can help prevent the browser
        from saving sensitive form information.
    </p>

</body>
</html>
