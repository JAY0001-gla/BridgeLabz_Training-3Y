<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding</h1>

    <p>
        Original:
        https://example.com/search?query=HTML & CSS
    </p>

    <p>
        Encoded:
        https://example.com/search?query=HTML%20%26%20CSS
    </p>

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML and CSS
    </a>

</body>
</html>
