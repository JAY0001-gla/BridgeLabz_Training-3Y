<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q7 - Mouse Coordinates Logger</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; }
  #trackingBox { position: relative; width: 400px; height: 400px; border: 2px solid #333; background: #fafafa; cursor: crosshair; overflow: hidden; }
  .dot { position: absolute; width: 12px; height: 12px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #coordinates { margin-top: 12px; font-weight: bold; }
</style>
</head>
<body>
<h1>Q7: Mouse Path and Coordinates Logger</h1>
<div id="trackingBox"></div>
<div id="coordinates">clientX: -, clientY: -</div>
<p>Move the mouse inside the box. Double-click to drop a red dot. Dot positions are also printed in the browser console (F12).</p>
<script src="q7.js"></script>
</body>
</html>
