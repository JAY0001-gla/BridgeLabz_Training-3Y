<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q4 - Theme Switcher</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 30px; min-height: 100vh; transition: background 0.3s, color 0.3s; }
  body.theme-light { background: #ffffff; color: #222222; }
  body.theme-dark { background: #1e1e1e; color: #f0f0f0; }
  body.theme-blue { background: #d6e8ff; color: #0b2e59; }
  button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
</style>
</head>
<body class="theme-light" data-theme="light">
<h1>Q4: Theme Switcher</h1>
<div>
  <button class="theme-button" data-theme-value="light">Light</button>
  <button class="theme-button" data-theme-value="dark">Dark</button>
  <button class="theme-button" data-theme-value="blue">Blue</button>
</div>
<p id="themeStatus">Current theme: light</p>
<p>Theme changes are also printed in the browser console (F12).</p>
<script src="q4.js"></script>
</body>
</html>
