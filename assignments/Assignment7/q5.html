<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q5 - Image Gallery with Modal</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; }
  #gallery { display: grid; grid-template-columns: repeat(3, 160px); gap: 12px; }
  #gallery img { width: 160px; height: 110px; object-fit: cover; cursor: pointer; border-radius: 6px; border: 2px solid transparent; }
  #gallery img:hover { border-color: #1976d2; }
  #modalOverlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; }
  #modalOverlay.open { display: flex; }
  #modalContent { background: #fff; padding: 12px; border-radius: 8px; max-width: 90vw; }
  #modalContent img { display: block; max-width: 100%; width: 560px; border-radius: 4px; }
  #modalCaption { text-align: center; margin: 8px 0 0; }
</style>
</head>
<body>
<h1>Q5: Image Gallery</h1>
<div id="gallery"></div>
<div id="modalOverlay">
  <div id="modalContent">
    <img id="modalImage" alt="">
    <p id="modalCaption"></p>
  </div>
</div>
<p>Actions are also printed in the browser console (F12).</p>
<script src="q5.js"></script>
</body>
</html>
