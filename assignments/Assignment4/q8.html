<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q8 - Dynamic Object Updater</title>
<style>
  body { font-family: Arial, sans-serif; margin: 30px; }
  .field { margin-bottom: 15px; }
  label { display: block; margin-bottom: 4px; }
  input { padding: 6px; width: 260px; }
</style>
</head>
<body>
<h1>Q8: Dynamic Object Updater</h1>
<form id="userForm">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name">
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email">
  </div>
  <div class="field">
    <label for="age">Age</label>
    <input type="number" id="age">
  </div>
  <button type="submit">Update</button>
</form>
<h2>Current User Object</h2>
<div id="output"></div>
<p>Updates are also printed in the browser console (F12).</p>
<script src="q8.js"></script>
</body>
</html>
